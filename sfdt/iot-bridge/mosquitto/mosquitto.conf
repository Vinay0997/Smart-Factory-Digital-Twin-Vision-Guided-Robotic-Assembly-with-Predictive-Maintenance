# mosquitto.conf
# Local MQTT broker configuration for the Smart Factory Digital Twin.
# Mounted into the eclipse-mosquitto container via docker-compose.yml:
#   ./iot-bridge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
#
# This is a development/portfolio configuration (anonymous access allowed
# on the local Docker network). For anything beyond local testing, enable
# password_file/TLS as noted below.

# --- Persistence ---
persistence true
persistence_location /mosquitto/data/

# --- Logging ---
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Standard MQTT listener ---
listener 1883
protocol mqtt
allow_anonymous true

# --- WebSocket listener (useful for browser-based dashboards/debug clients) ---
listener 9001
protocol websockets
allow_anonymous true

# ------------------------------------------------------------------
# Production hardening (disabled by default for local dev simplicity):
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
#
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
# ------------------------------------------------------------------

# --- Topic ACL placeholder (uncomment and create acl_file to restrict topics) ---
# acl_file /mosquitto/config/acl.conf
